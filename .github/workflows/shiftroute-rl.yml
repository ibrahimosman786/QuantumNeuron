name: ShiftRoute-RL tests
on:
  push:
    paths:
      - 'research/shiftroute-rl/**'
  pull_request:
    paths:
      - 'research/shiftroute-rl/**'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests
        run: |
          cd research/shiftroute-rl
          python -m pip install -e .
          python -m unittest discover -s tests -p test_shiftroute.py -v

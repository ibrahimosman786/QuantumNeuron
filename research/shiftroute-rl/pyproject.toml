[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftroute-rl"
version = "0.1.0"
description = "Reproducible toy benchmark for adaptive verification under agent distribution shift"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ShiftRoute-RL contributors"}]
dependencies = []

[project.scripts]
shiftroute-benchmark = "shiftroute_rl.benchmark:main"
shiftroute-bandit = "shiftroute_rl.bandit:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
research = ["torch>=2.2", "numpy>=1.26"]
